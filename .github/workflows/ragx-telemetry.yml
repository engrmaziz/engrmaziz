name: ragx-telemetry

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ragx-telemetry.yml"
      - ".github/scripts/generate_github_cards.py"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            assets/ragx/contribution-snake.svg
            assets/ragx/contribution-snake-dark.svg?palette=github-dark
      - name: Generate GitHub stats cards
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RAGX_USER: ${{ github.repository_owner }}
        run: python .github/scripts/generate_github_cards.py
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: refresh GitHub telemetry cards"
          file_pattern: |
            assets/ragx/contribution-snake*.svg
            assets/ragx/github-stats.svg
            assets/ragx/top-langs.svg
            assets/ragx/commit-graph.svg

