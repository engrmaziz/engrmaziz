      <text x="16" y="28" class="mono" fill="#00D4FF" font-size="10" letter-spacing="1.6">PROD RAG</text>
      <text x="16" y="58" fill="#E8F4FF" font-size="18">Allama Iqbal</text>
      <text x="16" y="82" fill="#8BA0B5" font-size="13">AIHK · CallBot</text>
      <text x="16" y="108" fill="#C9D6E3" font-size="12">1,000+ daily voice/WA</text>
