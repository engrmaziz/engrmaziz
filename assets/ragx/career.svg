  </defs>
  <rect width="1100" height="420" fill="url(#cbg)"/>
  <rect x="14" y="14" width="1072" height="392" fill="none" stroke="#00D4FF" stroke-opacity="0.35"/>
  <path d="M14 44 L14 14 L44 14" fill="none" stroke="#7DF9FF" stroke-width="2"/>
  <path d="M1056 14 L1086 14 L1086 44" fill="none" stroke="#7DF9FF" stroke-width="2"/>
  <text x="28" y="38" class="mono" fill="#8BA0B5" font-size="11" letter-spacing="2.4">RAGX // CAREER BUS</text>
