      <text x="16" y="28" class="mono" fill="#C9A227" font-size="10" letter-spacing="1.6">TEACH</text>
      <text x="16" y="58" fill="#E8F4FF" font-size="18">Bano Qabil</text>
      <text x="16" y="82" fill="#8BA0B5" font-size="13">Alkhidmat · volunteer</text>
      <text x="16" y="108" fill="#C9D6E3" font-size="12">Applied AI trainer</text>
      <text x="16" y="130" fill="#C9D6E3" font-size="12">RAG · agents · Python</text>
