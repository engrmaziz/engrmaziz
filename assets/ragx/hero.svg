<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 340" width="1100" height="340" role="img" aria-labelledby="title desc">
  <title id="title">RAGX heads-up display</title>
  <desc id="desc">Animated RAGX HUD for Musharraf Aziz, Senior Applied AI Engineer.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#030711"/>
      <stop offset="55%" stop-color="#07111f"/>
      <stop offset="100%" stop-color="#0a1a30"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00D4FF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00D4FF" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#00D4FF" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7DF9FF" stop-opacity="0.55"/>
      <stop offset="45%" stop-color="#00D4FF" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#00D4FF" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.4" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#00D4FF" stroke-width="0.4" opacity="0.12"/>
    </pattern>
  </defs>

  <rect width="1100" height="340" fill="url(#bg)"/>
  <rect width="1100" height="340" fill="url(#grid)"/>

  <!-- scan sweep -->
  <rect x="0" y="-80" width="1100" height="80" fill="url(#scan)" opacity="0.9">
    <animate attributeName="y" from="-80" to="340" dur="3.2s" repeatCount="indefinite"/>
  </rect>

  <!-- frame -->
  <rect x="14" y="14" width="1072" height="312" fill="none" stroke="#00D4FF" stroke-opacity="0.35" stroke-width="1"/>
  <path d="M14 44 L14 14 L44 14" fill="none" stroke="#7DF9FF" stroke-width="2"/>
  <path d="M1056 14 L1086 14 L1086 44" fill="none" stroke="#7DF9FF" stroke-width="2"/>
  <path d="M14 296 L14 326 L44 326" fill="none" stroke="#7DF9FF" stroke-width="2"/>
  <path d="M1056 326 L1086 326 L1086 296" fill="none" stroke="#7DF9FF" stroke-width="2"/>

  <text x="28" y="36" fill="#8BA0B5" font-family="Consolas, 'Courier New', monospace" font-size="11" letter-spacing="2.4">RAGX // PERSONAL ASSISTANT</text>
  <text x="1072" y="36" text-anchor="end" fill="#3DFF9A" font-family="Consolas, 'Courier New', monospace" font-size="11" letter-spacing="1.8">
    SYS.NOMINAL
    <animate attributeName="opacity" values="1;0.35;1" dur="2.2s" repeatCount="indefinite"/>
  </text>

  <!-- HUD rings -->
  <g transform="translate(170,178)" filter="url(#softGlow)">
    <circle r="108" fill="url(#coreGlow)"/>
    <circle r="118" fill="none" stroke="#00D4FF" stroke-opacity="0.18" stroke-width="1"/>

    <g>
      <circle r="102" fill="none" stroke="#00D4FF" stroke-width="1.2" stroke-dasharray="6 10" stroke-opacity="0.7"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="22s" repeatCount="indefinite"/>
    </g>
    <g>
      <circle r="86" fill="none" stroke="#7DF9FF" stroke-width="1.6" stroke-dasharray="40 18 8 18" stroke-linecap="round"/>
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="11s" repeatCount="indefinite"/>
    </g>
    <g>
      <circle r="68" fill="none" stroke="#C9A227" stroke-width="1" stroke-dasharray="2 8" stroke-opacity="0.85"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="7s" repeatCount="indefinite"/>
    </g>
    <circle r="48" fill="none" stroke="#00D4FF" stroke-width="1.4" stroke-opacity="0.9"/>
    <circle r="8" fill="#7DF9FF">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="1.6s" repeatCount="indefinite"/>
    </circle>
    <circle r="18" fill="none" stroke="#E8F4FF" stroke-opacity="0.35"/>
    <path d="M0 -48 V-18 M0 18 V48 M-48 0 H-18 M18 0 H48" stroke="#7DF9FF" stroke-width="0.8" stroke-opacity="0.55"/>

    <g font-family="Consolas, 'Courier New', monospace" font-size="9" fill="#8BA0B5" letter-spacing="1.4">
      <text x="0" y="-128" text-anchor="middle" fill="#00D4FF">RAG</text>
      <text x="128" y="4" text-anchor="middle">VOICE</text>
      <text x="0" y="136" text-anchor="middle" fill="#C9A227">PII</text>
      <text x="-128" y="4" text-anchor="middle">MCP</text>
    </g>
  </g>

  <!-- identity -->
  <g class="serif" font-family="'Book Antiqua', 'Palatino Linotype', Palatino, Georgia, 'Times New Roman', serif">
    <text x="340" y="118" fill="#8BA0B5" font-family="Consolas, 'Courier New', monospace" font-size="12" letter-spacing="3.2">SENIOR APPLIED AI ENGINEER  |  PEC REGISTERED</text>
    <text x="340" y="168" fill="#E8F4FF" font-size="42" font-weight="700" letter-spacing="1.4">MUSHARRAF AZIZ</text>
    <text x="340" y="198" fill="#00D4FF" font-family="Consolas, 'Courier New', monospace" font-size="14" letter-spacing="2">DETERMINISTIC LLM SYSTEMS  /  ENTERPRISE RAG  /  VOICE AI</text>
    <text x="340" y="226" fill="#8BA0B5" font-size="13">Lahore, Pakistan  |  maziz.me  |  Open to AI/ML roles and enterprise consulting</text>
  </g>

  <!-- metric chips -->
  <g font-family="Consolas, 'Courier New', monospace">
    <g transform="translate(340,250)">
      <rect width="168" height="52" rx="2" fill="#06101c" stroke="#00D4FF" stroke-opacity="0.35"/>
      <text x="12" y="20" fill="#8BA0B5" font-size="9" letter-spacing="1.6">HALLUCINATIONS</text>
      <text x="12" y="42" fill="#7DF9FF" font-size="18">0.00</text>
      <animate attributeName="opacity" values="0.7;1;0.7" dur="2.4s" repeatCount="indefinite"/>
    </g>
    <g transform="translate(520,250)">
      <rect width="168" height="52" rx="2" fill="#06101c" stroke="#00D4FF" stroke-opacity="0.35"/>
      <text x="12" y="20" fill="#8BA0B5" font-size="9" letter-spacing="1.6">VOICE LATENCY</text>
      <text x="12" y="42" fill="#7DF9FF" font-size="18">&lt;500ms</text>
    </g>
    <g transform="translate(700,250)">
      <rect width="168" height="52" rx="2" fill="#06101c" stroke="#C9A227" stroke-opacity="0.45"/>
      <text x="12" y="20" fill="#8BA0B5" font-size="9" letter-spacing="1.6">AGENT LOAD</text>
      <text x="12" y="42" fill="#C9A227" font-size="18">1K+/day</text>
    </g>
    <g transform="translate(880,250)">
      <rect width="168" height="52" rx="2" fill="#06101c" stroke="#00D4FF" stroke-opacity="0.35"/>
      <text x="12" y="20" fill="#8BA0B5" font-size="9" letter-spacing="1.6">COMMERCE SCALE</text>
      <text x="12" y="42" fill="#7DF9FF" font-size="18">500K/mo</text>
    </g>
  </g>
</svg>
