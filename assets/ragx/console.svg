<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 72" width="1100" height="72" role="img" aria-label="Command deck">
  <rect width="1100" height="72" fill="#050a14"/>
  <rect x="10" y="10" width="1080" height="52" fill="#07111f" stroke="#00D4FF" stroke-opacity="0.35"/>
  <circle cx="32" cy="36" r="5" fill="#3DFF9A">
    <animate attributeName="opacity" values="1;0.25;1" dur="1.8s" repeatCount="indefinite"/>
  </circle>
  <text x="50" y="32" fill="#7DF9FF" font-family="Consolas, 'Courier New', monospace" font-size="13" letter-spacing="1.6">RAGX ONLINE</text>
