<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 188" width="1100" height="188" role="img" aria-label="RAGX boot sequence">
  <defs>
    <linearGradient id="bootBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#04080f"/>
      <stop offset="100%" stop-color="#07121e"/>
    </linearGradient>
  </defs>
  <rect width="1100" height="188" fill="url(#bootBg)"/>
  <rect x="12" y="12" width="1076" height="164" fill="none" stroke="#00D4FF" stroke-opacity="0.4"/>
  <path d="M12 32 L12 12 L32 12" fill="none" stroke="#7DF9FF" stroke-width="1.6"/>
  <path d="M1068 12 L1088 12 L1088 32" fill="none" stroke="#7DF9FF" stroke-width="1.6"/>
  <path d="M12 156 L12 176 L32 176" fill="none" stroke="#7DF9FF" stroke-width="1.6"/>
  <path d="M1068 176 L1088 176 L1088 156" fill="none" stroke="#7DF9FF" stroke-width="1.6"/>

  <text x="28" y="34" fill="#C9A227" font-family="Consolas, 'Courier New', monospace" font-size="12" letter-spacing="2.2">RAGX BOOT SEQUENCE</text>
  <text x="1072" y="34" text-anchor="end" fill="#8BA0B5" font-family="Consolas, 'Courier New', monospace" font-size="11">v3.1.0-prod</text>

  <g font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#7DF9FF">
    <text x="32" y="64" opacity="0">
      &gt; loading ragx.assistant ............................. OK
      <animate attributeName="opacity" from="0" to="1" begin="0.2s" dur="0.15s" fill="freeze"/>
